# Public demo on Render's free plan: guest mode, every visitor gets a temporary
# in-memory database. Free services have no persistent disk and sleep after
# ~15 minutes without traffic; a restart wipes all guest data (by design).
# For permanent accounts on a paid plan with a disk see DEPLOY.md.
services:
  - type: web
    name: poryadok-crm
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: CRM_GUEST_MODE
        value: "1"
      - key: CRM_GUEST_HOURS
        value: "6"
      - key: CRM_MAX_GUESTS
        value: "20"
      - key: CRM_DB_PATH
        value: /tmp/crm/crm.sqlite
